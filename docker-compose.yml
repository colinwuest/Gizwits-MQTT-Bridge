services:
  hot_water:
    image: cwuest/gizwits-mqtt-bridge:latest
    container_name: hot_water
    restart: unless-stopped
    environment:
      MQTT_HOST: "10.0.8.3"
      MQTT_PORT: "1883"
      MQTT_USER: "myuser"
      MQTT_PASS: "mypassword"
      GIZWITS_TOKEN: "newtoken"    # update here if token expires
      GIZWITS_APP_ID: "appid"
      GIZWITS_DID: "deviceid"
      DATA_DIR: "/data"
    volumes:
      - hot_water_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  hot_water_data:
